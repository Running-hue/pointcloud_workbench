<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猪体坐标点云</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px system-ui;color:#293746;background:#eef2f6;display:flex;flex-direction:column}.viewlayout{display:flex;flex:1;min-height:0}main{position:relative;flex:1;min-width:0}canvas{width:100%;height:100%;display:block;touch-action:none}.tools{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;padding:10px 12px 6px;flex-shrink:0;overflow-x:auto}.tools button{flex-shrink:0;white-space:nowrap}#toggleInfo{margin-left:auto}button{font:inherit;border:1px solid #c7d2df;border-radius:5px;background:white;padding:6px 9px;cursor:pointer}aside{width:235px;background:white;padding:16px;border-left:1px solid #d4dde6;overflow:auto}h2{font-size:15px;margin:0 0 12px}p{line-height:1.7;font-size:12px;margin:9px 0}.muted{color:#68798b}b{font-variant-numeric:tabular-nums}.x{color:#c6413d}.y{color:#238451}.z{color:#386ccd}a{color:#247767}.hint{position:absolute;bottom:12px;left:14px;color:#68798b;font-size:11px;pointer-events:none}.notice{color:#906d2c}#reference{overflow-wrap:anywhere;font-size:10px}[hidden]{display:none!important}#toggleInfo{color:#247767}#toggleInfo:focus-visible{outline:2px solid #247767;outline-offset:2px}@media(max-width:480px){.tools{padding:7px 8px 5px;gap:4px}.tools button{font-size:11px;padding:5px 6px}}@media(max-width:650px){aside{width:175px;padding:10px}aside p{font-size:11px}}</style></head><body>
<div class="tools" role="toolbar" aria-label="点云视角与说明"><button data-view="top">俯视 XY</button><button data-view="side">侧视 XZ</button><button data-view="rear">后视 YZ</button><button data-view="oblique">斜视</button><button id="reset">重置</button><button id="toggleInfo" aria-controls="coordinateInfo" aria-expanded="true">隐藏说明</button></div><div class="viewlayout"><main><canvas id="cloud"></canvas><div class="hint">拖动旋转 · 滚轮缩放<br>网格为地面 Z=0；彩色坐标箭头长 250 mm</div></main>
<aside id="coordinateInfo"><h2>地面与猪体坐标</h2><p id="status"></p><p><span class="x">X：尾根 → 颈根</span><br><span class="y">Y：猪体左侧</span><br><span class="z">Z：地面法线向上</span></p><p>原点：尾根在地面的投影<br>单位：mm · 保留真实尺度</p><p id="count"></p><p id="quality"></p><p class="muted">Z 表示距拟合地面的法向距离；地面水平时才可解释为竖直高度。</p><p id="warnings" class="notice"></p><p id="reference" class="muted"></p><div id="files"><p><a href="cloud_body_mm.ply">猪体坐标 PLY</a> · <a href="body_points.npz">NPZ</a></p><p><a href="alignment.json">坐标记录</a> · <a href="alignment_check.png">对齐检查图</a></p></div></aside></div>
<script>
'use strict';
const DATA=__DATA__, r=DATA.record, $=id=>document.getElementById(id), canvas=$('cloud'),ctx=canvas.getContext('2d');
$('status').textContent=r.confirmed?'坐标已确认':'待核对的对齐预览';
$('count').textContent=`${r.display_filtered?'清理后点云':'完整点云'} ${DATA.count.toLocaleString()} 点；显示 ${DATA.xyz.length.toLocaleString()} 点`;
if(r.display_filtered){$('status').textContent+=' · 清理版本';const links=$('files').querySelectorAll('a');links[0].textContent='原始猪体坐标 PLY';links[1].textContent='原始 NPZ';}
$('quality').textContent=`地面内点 ${(r.ground_quality.inlier_ratio*100).toFixed(1)}% · 拟合残差 RMS ${r.ground_quality.inlier_rmse_mm.toFixed(2)} mm（不代表实际测量精度）`;
$('warnings').textContent=r.warnings.join(' ');$('reference').textContent='坐标参考 '+r.reference_id;$('files').hidden=!r.confirmed;
let yaw=-.35,pitch=.6,zoom=1,drag=null;
const bounds=[0,1,2].map(j=>{const a=DATA.xyz.map(p=>p[j]).sort((a,b)=>a-b);return [a[Math.floor(a.length*.005)],a[Math.min(a.length-1,Math.floor(a.length*.995))]]});
bounds[2][0]=Math.min(bounds[2][0],0);bounds[0][0]=Math.min(bounds[0][0],0);
const center=bounds.map(b=>(b[0]+b[1])/2),extent=Math.max(1,...bounds.map(b=>b[1]-b[0]));
function rotate(p){const a=p.map((v,j)=>v-center[j]),x=Math.cos(yaw)*a[0]-Math.sin(yaw)*a[1],y=Math.sin(yaw)*a[0]+Math.cos(yaw)*a[1];return [x,Math.sin(pitch)*y-Math.cos(pitch)*a[2],Math.cos(pitch)*y+Math.sin(pitch)*a[2]]}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,d=devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#eef2f6';ctx.fillRect(0,0,w,h);const scale=Math.min(w,h)*.7/extent*zoom;
const screen=p=>{const q=rotate(p);return [w/2+q[0]*scale,h/2+q[1]*scale]};
function line(a,b,color,width=1){const p=screen(a),q=screen(b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(...q);ctx.stroke()}
const loX=Math.floor(bounds[0][0]/250)*250-250,hiX=Math.ceil(bounds[0][1]/250)*250+250,loY=Math.floor(bounds[1][0]/250)*250-250,hiY=Math.ceil(bounds[1][1]/250)*250+250;
for(let x=loX;x<=hiX;x+=250)line([x,loY,0],[x,hiY,0],'#d0dce2');for(let y=loY;y<=hiY;y+=250)line([loX,y,0],[hiX,y,0],'#d0dce2');
const points=DATA.xyz.map((p,i)=>({q:rotate(p),i})).sort((a,b)=>b.q[2]-a.q[2]);for(const p of points){ctx.fillStyle=`rgb(${DATA.rgb[p.i].join(',')})`;ctx.fillRect(w/2+p.q[0]*scale,h/2+p.q[1]*scale,2,2)}
ctx.font='12px system-ui';[[250,0,0],[0,250,0],[0,0,250]].forEach((p,i)=>{const color=['#c6413d','#238451','#386ccd'][i];line([0,0,0],p,color,3);ctx.fillStyle=color;ctx.fillText(['X → 颈根','Y → 左侧','Z → 上方'][i],...screen(p))});
for(const [key,label] of [['tail','尾根'],['neck','颈根']]){const p=r.annotations[key].xyz_camera_mm,m=r.frame.camera_to_body_4x4,q=m.slice(0,3).map(row=>row[0]*p[0]+row[1]*p[1]+row[2]*p[2]+row[3]);line([q[0],q[1],0],q,'#8a7048',2);const s=screen(q);ctx.fillStyle='#925a2a';ctx.beginPath();ctx.arc(s[0],s[1],4,0,2*Math.PI);ctx.fill();ctx.fillText(label,s[0]+6,s[1]-6)}
ctx.fillStyle='#68798b';ctx.fillText('250 mm 地面网格',16,24)}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.5,Math.min(1.57,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));draw()};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{[yaw,pitch]=({top:[0,Math.PI/2],side:[0,0],rear:[Math.PI/2,0],oblique:[-.35,.6]})[b.dataset.view];draw()});$('reset').onclick=()=>{yaw=-.35;pitch=.6;zoom=1;draw()};canvas.ondblclick=$('reset').onclick;window.onresize=draw;
function setInfoHidden(hidden){$('coordinateInfo').hidden=hidden;$('toggleInfo').textContent=hidden?'显示说明':'隐藏说明';$('toggleInfo').setAttribute('aria-expanded',String(!hidden));draw()}
$('toggleInfo').onclick=()=>{const hidden=!$('coordinateInfo').hidden;setInfoHidden(hidden);try{localStorage.setItem('pointcloud-body-info-hidden',hidden?'1':'0')}catch{}};
window.addEventListener('storage',e=>{if(e.key==='pointcloud-body-info-hidden')setInfoHidden(e.newValue==='1')});
let infoHidden=false;try{infoHidden=localStorage.getItem('pointcloud-body-info-hidden')==='1'}catch{}setInfoHidden(infoHidden);
</script></body></html>
