<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>猪体毫米点云 · 多模态重建</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#eef2f6;color:#293746;font:13px system-ui;display:flex;flex-direction:column}header{padding:14px 20px;border-bottom:1px solid #d4dde6;display:flex;gap:16px;align-items:center;flex-shrink:0}h1{font-size:19px;margin:0}header small{color:#68798b}.tag{background:#fbf3db;color:#906d2c;padding:4px 7px;border-radius:5px;font-size:10px}.tag.good{background:#e4f2e9;color:#39705b}main{display:grid;grid-template-columns:minmax(0,1fr) clamp(230px,24vw,285px);flex:1;min-height:0;overflow:hidden}.view{position:relative;min-width:0;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.tools{position:absolute;top:14px;left:16px;display:flex;gap:6px;flex-wrap:wrap;right:14px}button,select{font:inherit;border:1px solid #c7d2df;background:#ffffff;color:#293746;padding:7px 9px;border-radius:6px;cursor:pointer}.tools button,.tools select{font-size:12px}.hint{position:absolute;bottom:15px;left:20px;right:12px;color:#68798b;font-size:11px;line-height:1.6;pointer-events:none}aside{padding:14px;background:#ffffff;border-left:1px solid #d4dde6;display:flex;flex-direction:column;gap:15px;min-height:0;overflow:hidden}aside section{flex-shrink:0}h2{font-size:12px;color:#466d63;margin:0 0 9px}.asidehead{display:flex;align-items:center;justify-content:space-between;gap:8px}.asidehead h2{margin:0}.countline{display:flex;align-items:baseline;gap:8px;margin:7px 0}.value{font-size:25px;font-variant-numeric:tabular-nums}.countline small{font-size:10px;color:#68798b}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:#68798b;font-size:11px}.metrics span{display:flex;flex-direction:column;gap:3px}.metrics b{color:#293746;font-size:13px;font-weight:500}#identity{color:#68798b;font-size:11px;margin-bottom:8px;overflow-wrap:anywhere}table{width:100%;font-size:11px;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{text-align:right;padding:6px 1px;border-bottom:1px solid #d4dde6;white-space:nowrap}th{color:#68798b;font-weight:500}td:first-child,th:first-child{text-align:left}a{color:#417f73;text-decoration:none}a:hover{text-decoration:underline}#axis{color:#68798b;font-size:10px;margin-top:7px;line-height:1.6}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checkimage{background:#f4f6f9;border:1px solid #c7d2df;border-radius:6px;overflow:hidden;text-align:center;font-size:10px}.checkimage img{width:100%;height:65px;object-fit:contain;display:block;background:#e8edf2}.checkimage span{display:block;padding:5px 2px}.asidefoot{margin-top:auto;display:flex;flex-direction:column;gap:9px;min-height:0}.asidefoot p{font-size:10px;line-height:1.6;margin:0;color:#906d2c}.asidefoot>a{font-size:11px}#showNotes{font-size:11px;text-align:left;color:#906d2c;padding:7px 9px}#fileLinks{font-size:11px;line-height:1.5}#fileLinks p{margin:4px 0;color:#68798b}.embedded>header,.embedded #identity,.embedded #fileLinks{display:none}dialog{width:620px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow:auto;background:#ffffff;color:#293746;border:1px solid #bbcbd6;border-radius:9px;padding:20px}dialog::backdrop{background:#28394e55}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font-size:15px;margin:0}.modalhead button{padding:1px 9px;font-size:20px}#warn{font-size:12px;color:#906d2c;line-height:1.7}#warn p{margin:12px 0}.sourcepaths{font-size:11px;line-height:1.6;color:#68798b;overflow-wrap:anywhere;border-top:1px solid #c7d2df;padding-top:12px}.sourcepaths p{margin:6px 0}@media(max-height:580px){aside{padding:10px 12px;gap:9px}h2{margin-bottom:5px}.value{font-size:22px}.countline{margin:4px 0}td,th{padding:4px 1px}.checkimage img{height:44px}.checkimage span{padding:3px 1px}.asidefoot{gap:6px}}@media(max-width:780px){main{grid-template-columns:minmax(0,1fr) 230px}.tools button,.tools select{padding:6px 7px;font-size:11px}.tools{gap:4px;left:12px;top:12px}.hint{font-size:10px;left:14px}}
@media(max-height:470px){.checkimage img{display:none}aside{gap:7px}.asidefoot p{font-size:9px;line-height:1.4}td,th{padding:3px 1px}.metrics b{font-size:12px}.value{font-size:20px}}
.metrics em{font-style:normal}@media(max-height:390px){.metrics span{flex-direction:row;align-items:baseline;gap:3px}.metrics em{font-size:9px}.metrics b{font-size:10px}.asidefoot p{display:none}}
@media(max-height:360px){.embedded .asidehead{display:none}aside{gap:4px;padding-top:8px;padding-bottom:8px}h2{margin-bottom:3px}#axis{margin-top:4px}}
</style></head><body class="__BODY_CLASS__">
<header><h1>多模态猪体点云</h1><small>深度相机坐标 · 单位 mm · 实际尺度</small></header>
<main><div class="view"><canvas id="cloud"></canvas><div class="tools">
<select id="mode" aria-label="配色方式"><option value="rgb">RGB 配色</option><option value="ir">红外强度</option><option value="depth">深度 Z</option><option value="valid">RGB 有效性</option></select>
<select id="fit" aria-label="点云取景范围"><option value="body">主体视野</option><option value="full">全部点</option></select>
<button data-view="front">相机正视</button><button data-view="side">侧视</button><button data-view="oblique">斜视</button><button id="reset">重置</button>
</div><div class="hint">拖动旋转 · 滚轮缩放 · 双击重置<br><span id="viewHint"></span><br>导出保留相机原点和毫米尺度</div></div>
<aside aria-label="点云信息"><section class="cloudsummary"><div id="identity"></div><div class="asidehead"><h2>当前点云</h2><span class="tag" id="status"></span></div><div class="countline"><div class="value" id="count"></div><small>可见表面</small></div><div class="metrics"><span><em>深度有效率</em><b id="depthRatio"></b></span><span><em>RGB 可用率</em><b id="rgbRatio"></b></span></div></section>
<section><h2>相机坐标范围 / mm</h2><table><thead><tr><th>轴</th><th>最小</th><th>最大</th><th>跨度</th></tr></thead><tbody id="bounds"></tbody></table><div id="axis">X 向右 · Y 向下 · Z 向前<br>轴向跨度不等于解剖体尺。</div></section>
<section class="checks"><h2>辅助检查</h2><div class="checkgrid"><a class="checkimage" href="mask_depth_check.png" aria-label="掩码与有效深度检查图"><img src="mask_depth_check.png" alt="掩码与深度"><span>掩码与深度 ↗</span></a><a class="checkimage" href="__RGB_CHECK_IMAGE__" aria-label="__RGB_CHECK_LABEL__检查图"><img src="__RGB_CHECK_IMAGE__" alt="__RGB_CHECK_LABEL__"><span>__RGB_CHECK_LABEL__ ↗</span></a></div></section>
<div class="asidefoot"><p id="shortNote"></p><button id="showNotes">查看数据说明</button><a href="pointcloud.json">查看生成记录 ↗</a><div id="fileLinks"><p>完整点云文件</p><a id="plyFileLink" href="__PRIMARY_PLY__">__PLY_LABEL__</a> · <a href="points.npz">NPZ</a></div></div></aside></main>
<dialog id="notesDialog"><div class="modalhead"><h2>复核提醒与数据说明</h2><button id="closeNotes" aria-label="关闭数据说明">×</button></div><div id="warn"></div><div class="sourcepaths"><p id="sourcePath"></p><p id="maskPath"></p><p>坐标原点：原始深度相机；单位：毫米。可见表面不补全遮挡部分，实际测量精度仍需用已知尺寸实物验证。</p></div></dialog>
<script>
const DATA=__POINT_DATA__;
const r=DATA.report,s=r.stats,$=id=>document.getElementById(id),canvas=$('cloud'),ctx=canvas.getContext('2d');
$('status').textContent=r.reviewed?'分割已确认':'初稿预览';$('status').classList.toggle('good',r.reviewed);
if(r.infrared_available===false){const option=document.querySelector('#mode option[value="ir"]');option.disabled=true;option.textContent='红外未关联';}
$('mode').value=r.input_mode==='infrared'?'ir':'rgb';
$('identity').textContent=[r.camera?.model,r.input_mode==='infrared'?'IR 分割':'RGB 分割','耳标 '+r.pig_id+' / '+r.capture_id].filter(Boolean).join(' · ');
$('count').textContent=s.points.toLocaleString()+' 点';
$('depthRatio').textContent=(100*s.valid_depth_ratio).toFixed(2)+'%';$('rgbRatio').textContent=(100*s.rgb_valid_ratio).toFixed(2)+'%';
$('shortNote').textContent=r.reviewed?'单视角可见表面；实际体尺需测量验证。':'未审核分割初稿，仅供流程预览。';
const registration=r.rgb_registration;
if(registration){$('shortNote').textContent+=' RGB 配准记录：'+({consistent:'几何一致，实物精度未验证',review_required:'需复核检查图',unavailable:'缺少交叉核对数据'}[registration.status]||'未核对')+'。';}

['X','Y','Z'].forEach((a,j)=>{const tr=document.createElement('tr');[a,s.xyz_min_mm[j].toFixed(1),s.xyz_max_mm[j].toFixed(1),s.camera_axis_extent_mm[j].toFixed(1)].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});$('bounds').append(tr)});
if(registration?.masked_surface?.absolute_z_residual_mm){const check=registration.masked_surface,p=document.createElement('p'),z=check.absolute_z_residual_mm;p.textContent=`原始深度→RGB 对齐网格，掩码内稳定点 ${check.compared_points.toLocaleString()}；轴向深度差中位数 ${z.p50.toFixed(2)} mm，95%分位 ${z.p95.toFixed(2)} mm。${(check.agreement_ratio*100).toFixed(1)}% 满足诊断容差 max(5 mm, 1% Z)。这是两份深度数据的一致性比较，不是物理标定误差。检查图：青色为原始深度边缘，黄色为 RGB 掩码边界。`;$('warn').append(p);}
r.warnings.forEach(w=>{const p=document.createElement('p');p.textContent=w;$('warn').append(p)});
$('showNotes').textContent=r.warnings.length?'复核提醒（'+r.warnings.length+' 项） ↗':'查看数据说明 ↗';
$('showNotes').onclick=()=>$('notesDialog').showModal();$('closeNotes').onclick=()=>$('notesDialog').close();
$('sourcePath').textContent='原始采集：'+(r.source_dir||'未记录');$('maskPath').textContent='分割来源：'+(r.segmentation_dir||'未记录');
let yaw=-.35,pitch=-.4,zoom=1,drag=null;
// A running local service may still have the previous renderer loaded in memory.
const framing=DATA.view_bounds||{full:{min:s.xyz_min_mm,max:s.xyz_max_mm},body:{min:s.xyz_min_mm,max:s.xyz_max_mm},outside_body_points:0};
let center,extent;
function fitView(){const bounds=framing[$('fit').value];center=bounds.min.map((v,j)=>(v+bounds.max[j])/2);extent=Math.max(...bounds.max.map((v,j)=>v-bounds.min[j]),1);zoom=1;
$('viewHint').textContent=$('fit').value==='body'?`主体取景 · 完整点云保留${framing.outside_body_points?' · 可切换“全部点”查看边界远点':''}`:'全部点取景 · 包含边界远点';draw()}
function reset(){yaw=-.35;pitch=-.4;zoom=1;draw()}
function transform(p){const x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2],x1=Math.cos(yaw)*x+Math.sin(yaw)*z,z1=-Math.sin(yaw)*x+Math.cos(yaw)*z;return [x1,Math.cos(pitch)*y-Math.sin(pitch)*z1,Math.sin(pitch)*y+Math.cos(pitch)*z1]}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#eef2f6';ctx.fillRect(0,0,w,h);const scale=Math.min(w,h)*.73/extent*zoom;
ctx.strokeStyle='#dce3ec';ctx.lineWidth=1;for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(w/2+i*100*scale,0);ctx.lineTo(w/2+i*100*scale,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,h/2+i*100*scale);ctx.lineTo(w,h/2+i*100*scale);ctx.stroke()}
const mode=$('mode').value,points=DATA.xyz.map((p,i)=>({p:transform(p),i})).sort((a,b)=>b.p[2]-a.p[2]);
for(const q of points){let color=DATA[mode]?.[q.i];if(mode==='depth'){const t=(DATA.xyz[q.i][2]-s.xyz_min_mm[2])/Math.max(s.camera_axis_extent_mm[2],1);color=[40+180*t,215-70*t,220-160*t]}if(mode==='valid')color=DATA.valid[q.i]?[50,220,165]:[245,110,80];ctx.fillStyle=`rgb(${color[0]},${color[1]},${color[2]})`;ctx.fillRect(w/2+q.p[0]*scale,h/2+q.p[1]*scale,1.9,1.9)}
ctx.strokeStyle='#68798b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(28,h-95);ctx.lineTo(28+100*scale,h-95);ctx.stroke();ctx.fillStyle='#62778a';ctx.font='12px system-ui';ctx.fillText('100 mm',28,h-104);ctx.fillText(`预览 ${DATA.xyz.length.toLocaleString()} / ${s.points.toLocaleString()} 点`,28,78);
['X','Y','Z'].forEach((name,j)=>{const p=center.slice();p[j]+=extent*.12;const q=transform(p),dx=q[0]/extent*450,dy=q[1]/extent*450;ctx.strokeStyle=['#b95444','#417f62','#5279c2'][j];ctx.beginPath();ctx.moveTo(w-82,h-105);ctx.lineTo(w-82+dx,h-105+dy);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.fillText(name,w-80+dx,h-108+dy)})}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch+=(e.clientY-drag[1])*.008;drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));draw()};canvas.ondblclick=reset;$('reset').onclick=reset;$('mode').onchange=draw;$('fit').onchange=fitView;
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{[yaw,pitch]=b.dataset.view==='front'?[0,0]:b.dataset.view==='side'?[Math.PI/2,0]:[-.35,-.4];draw()});window.onresize=draw;$('fit').value='body';fitView();
</script></body></html>
