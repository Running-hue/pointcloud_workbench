<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>多模态点云工作台</title><link rel="stylesheet" href="/workbench.css"></head>
<body>
<header><div class="brand"><div class="brandtitle"><span class="logo">◈</span><h1>多模态点云工作台</h1><span class="sub">相机坐标 · 毫米尺度</span></div><p id="contextPath">选择输入目录，生成实际尺度点云</p></div><nav aria-label="工作台操作"><button id="configure">目录设置</button><button id="openResults">打开成果目录</button><button id="generate" class="primary" aria-describedby="generationHint">生成并导出</button><button id="export">导出点云</button></nav><div id="datasetSummary" class="muted">尚未载入采集</div></header>
<section class="workspacebar" aria-label="当前目录"><div class="pathsummary"><button class="pathshortcut" data-field="source"><span>原始</span><b id="sourceSummary">未选择</b></button><button class="pathshortcut" data-field="segmentation"><span>分割</span><b id="segmentationSummary">未选择</b></button><button class="pathshortcut" data-field="parent"><span>导出</span><b id="parentSummary">未选择</b></button></div><label class="check"><input id="draft" type="checkbox">允许初稿预览</label></section>
<div id="message" role="status" aria-live="polite"></div>
<div id="generationHint" role="status" aria-live="polite"></div>
<section id="jobPanel" class="jobpanel" hidden>
<div class="jobsummary"><strong id="jobTitle"></strong><span id="jobCounts"></span><button id="jobToggle" aria-expanded="false" aria-controls="jobBody" hidden>查看详情</button><button id="stop">完成当前采集后停止</button></div>
<div id="jobBody"><progress id="progress" value="0" max="1"></progress><div id="jobCurrent"></div><details id="jobDetails"><summary>查看跳过或失败项</summary><div id="jobErrors"></div></details></div>
</section>
<main><aside class="listpanel"><div class="listhead"><h2>猪只与采集</h2><span id="selectedCount"></span></div><input id="search" placeholder="搜索耳标、采集时间" aria-label="搜索采集"><div class="filters"><select id="filter" aria-label="筛选采集"><option value="all">全部采集</option><option value="cloud">已生成点云</option><option value="reviewed">分割已确认</option><option value="draft">分割待确认</option><option value="missing">缺失文件</option></select><label><input id="selectAll" type="checkbox">选中筛选结果</label></div><div id="frames" class="frames"></div><div class="listfooter" id="listFooter"></div></aside>
<section class="viewerpanel"><div class="viewerhead"><div><strong id="currentTitle">选择一次采集查看点云</strong><span id="currentTag" class="tag" hidden></span></div><button id="exportCurrent" disabled>导出当前采集</button></div><div id="empty"><div class="emptyicon">◈</div><h2>从分割结果到实际尺度点云</h2><p>点击顶部“目录设置”选择输入与导出目录，勾选采集，再生成并导出。</p><p class="muted">PLY、NPZ、检查图、生成记录和预览页按原目录层级一起保存。</p></div><iframe id="viewer" title="三维点云查看器" hidden></iframe></section></main>
<footer><span id="destination"></span><button id="reveal">在系统中打开成果文件夹</button></footer>
<dialog id="directoryDialog"><form method="dialog"><div class="modalhead"><h2>输入与导出目录</h2><button value="cancel" aria-label="关闭目录设置">×</button></div><p>选择根目录，按“猪只／采集时间”匹配文件。所有“选择文件夹”均打开系统目录窗口。</p>
<div class="directoryrow"><label for="source">原始采集目录</label><div class="pathrow"><input id="source" placeholder="包含 pig_编号／采集时间 的根目录" spellcheck="false"><button type="button" class="browse" data-field="source">选择文件夹</button></div></div>
<div class="directoryrow"><label for="segmentation">分割结果目录</label><div class="pathrow"><input id="segmentation" placeholder="包含 dataset.json 的分割成果根目录" spellcheck="false"><button type="button" class="browse" data-field="segmentation">选择文件夹</button></div></div>
<div class="directoryrow"><label for="parent">导出目录</label><div class="pathrow"><input id="parent" placeholder="保存点云成果的父文件夹" spellcheck="false"><button type="button" class="browse" data-field="parent">选择文件夹</button></div></div>
<div class="directoryrow"><label for="name">成果文件夹名</label><input id="name" spellcheck="false"></div><p id="directoryMessage" role="status"></p><div class="modalfoot"><span>保留原目录层级，原始数据只读</span><button type="button" id="finishDirectories">完成并载入</button><button type="button" id="load" class="primary">核对并载入目录</button></div></form></dialog>
<dialog id="exportDialog"><form method="dialog"><div class="modalhead"><h2>按文件夹导出点云</h2><button value="cancel" aria-label="关闭">×</button></div><p>完整复制每次采集的所有成果，并保留原来的目录层级。</p><div class="exportdestination"><span>导出位置</span><button type="button" id="exportSettings">更改目录或成果名</button></div><fieldset><legend>导出范围</legend><label><input type="radio" name="scope" value="current">当前采集</label><label><input type="radio" name="scope" value="selected" checked>已勾选且已生成的采集</label><label><input type="radio" name="scope" value="all">全部已生成采集</label></fieldset><div class="exportplan"><span id="exportPath"></span><pre id="exportTree"></pre></div><div class="modalfoot"><span id="exportCount"></span><button value="cancel">取消</button><button type="button" id="confirmExport" class="primary">开始按文件夹导出</button></div></form></dialog>
<script>const APP_TOKEN='__TOKEN__';</script><script src="/workbench.js"></script>
</body></html>
